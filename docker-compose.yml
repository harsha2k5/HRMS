services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_NAME=Apex Global HRMS
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=hrms_db
      - DB_USER=hrms_user
      - DB_PASSWORD=hrms_secret
    volumes:
      - ./storage/uploads:/var/www/html/storage/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: hrms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: hrms_db
      MYSQL_USER: hrms_user
      MYSQL_PASSWORD: hrms_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
